name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shwethabathina
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a855f7&color_dots=#fbf7ff,#eee4ff,#d8b4fe,#c084fc,#9b6ed8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e9b8ff&color_dots=#191229,#44305f,#724994,#a878cc,#d8a4ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
